<source>                        # <source> section
  @type ...
  @label @access_logs           # plugin parameter / route to <label> section / == @access_logs
  # ...
</source>

<source>                        # <source> section
  @type ...
  @label @system_metrics        # plugin parameter / route to <label> section / == @system_metrics
  # ...
</source>

<label @access_logs>            # <label> section
  <match **>
    @type file
    path ...
  </match>
</label>

<label @system_metrics>         # <label> section
  <match **>
    @type file
    path ...
  </match>
</label>

# 2. @log_level & log_level
<system>
  log_level info                # GLOBAL log level
</system>

<source>
  # ...
  @log_level debug              # source's log level
</source>
