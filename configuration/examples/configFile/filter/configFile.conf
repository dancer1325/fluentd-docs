<source>
  @type http
  port 9880
</source>

<filter myapp.access>
  @type record_transformer
  <record>                              # add this record | event
    host_param "#{Socket.gethostname}"
  </record>
</filter>

# 1. if there are MULTIPLE filters | SAME tag -> 👀applied | descending order👀
<filter myapp.access>
  @type record_transformer
  <record>                              # add this record | event
    host_param "#{Socket.getport}"
  </record>
</filter>

<match myapp.access>
  @type file
  path /var/log/fluent/access
</match>
